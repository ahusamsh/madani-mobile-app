<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Vision engines compared (simulated)</title></head>
<body><h1>Vision engines compared — SIMULATED camera frames</h1><pre id="log"></pre><script type="module">
// ?engines=v1,v2,v3  ?pages=13,17  ?zones=2  ?truth=1 (tips on PDF text-layer glyph positions)
// ?source=pdf : the camera sees pages rendered by pdf.js from books/ar.pdf (vector), NOT the JPG references the engine indexes
import { VisionEngine } from '../engine/engine.mjs';
import { VisionEngineV2 } from '../v2/engine-v2.mjs';
import { VisionEngineV3 } from '../v3/engine-v3.mjs';
import { parseIndex } from '../v2/ref-index.mjs';
import { loadGray } from '../engine/browser-refs.mjs';
import * as pdfjs from '../../vendor/pdf.mjs';
import { buildScenarios, runCompare } from './compare.mjs';
const root = new URL('../../', import.meta.url), q = new URLSearchParams(location.search), log = s => (document.getElementById('log').textContent += s + '\n');
async function pdfGray(doc, n, width = 640) {
  const p = await doc.getPage(n), vp0 = p.getViewport({ scale: 1 }), vp = p.getViewport({ scale: width / vp0.width }), c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height); const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); await p.render({ canvasContext: ctx, viewport: vp }).promise;
  const px = ctx.getImageData(0, 0, c.width, c.height).data, d = new Uint8ClampedArray(c.width * c.height);
  for (let i = 0, j = 0; i < d.length; i++, j += 4) d[i] = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];
  return { w: c.width, h: c.height, d };
}
try {
  const library = await (await fetch(new URL('data/audio-library.json', root))).json();
  const idx = parseIndex(await (await fetch(new URL('vision/data/ref-index.bin', root))).arrayBuffer());
  const truth = q.get('truth') ? (await (await fetch(new URL('vision/bench/pdf-truth.json', root))).json()).pages : null;
  const pages = (q.get('pages') || '17,18,19,20,21').split(',').map(Number), grays = new Map(), urls = new Map(idx.pages.map(p => [p.pageId, new URL(p.url, root).href]));
  for (const p of pages) if (urls.has(p)) grays.set(p, await loadGray(urls.get(p)));
  let sourceGrays = null;
  if (q.get('source') === 'pdf') {
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.mjs', root).href;
    const doc = await pdfjs.getDocument({ url: new URL('books/ar.pdf', root).href, cMapUrl: new URL('vendor/cmaps/', root).href, cMapPacked: true, standardFontDataUrl: new URL('vendor/standard_fonts/', root).href }).promise;
    sourceGrays = new Map(); for (const p of pages) sourceGrays.set(p, await pdfGray(doc, p));
  }
  const scenarios = buildScenarios(library, grays, pages, +(q.get('zones') || 2), 20261104, { truth });
  const out = { pages, environment: navigator.userAgent, source: sourceGrays ? 'pdf.js render of books/ar.pdf' : 'reference JPG', truth: !!truth, scenarios: scenarios.length };
  const E = { v1: VisionEngine, v2: VisionEngineV2, v3: VisionEngineV3 };
  for (const which of (q.get('engines') || 'v2,v3').split(',')) {
    const e = new E[which]({ library, loadGray: id => loadGray(urls.get(id)) });
    for (const p of idx.pages) e.addReferencePage(p.pageId, grays.get(p.pageId) ?? null, p.features, p.size, p.thumb);
    out[which] = runCompare(e, scenarios, grays, { log, sourceGrays }); log(which + ' ' + JSON.stringify(out[which].summary));
  }
  window.__compare = out;
} catch (e) { window.__compare = { error: String(e.stack || e) }; log(String(e.stack || e)); }
</script></body></html>
